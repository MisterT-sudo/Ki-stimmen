# Veröffentlicht den Ordner website/ über GitHub Pages,
# sobald sich auf main etwas in website/ ändert (oder per Hand über "Run workflow").
name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur die Website-Dateien bereitstellen (ohne Anleitung und Vorschaubilder)
        run: |
          mkdir _site
          cp -r website/. _site/
          rm -f _site/*.md _site/vorschau_*.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
